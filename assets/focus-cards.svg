<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Research and engineering focus</title>
  <desc id="desc">Two visual cards showing research and engineering areas.</desc>
  <rect width="1200" height="370" rx="24" fill="#0D1724"/>
  <rect x="36" y="35" width="548" height="300" rx="18" fill="#141F2B" stroke="#304150" stroke-width="1.5"/>
  <rect x="616" y="35" width="548" height="300" rx="18" fill="#141F2B" stroke="#304150" stroke-width="1.5"/>
  <rect x="70" y="70" width="90" height="4" rx="2" fill="#6B879C"/>
  <rect x="650" y="70" width="90" height="4" rx="2" fill="#7B858E"/>
  <text x="70" y="112" fill="#F2F5F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">RESEARCH</text>
  <text x="650" y="112" fill="#F2F5F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">ENGINEERING</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#C5CED6">
    <circle cx="78" cy="153" r="4" fill="#6B879C"/><text x="96" y="160">Visual anomaly detection</text>
    <circle cx="78" cy="193" r="4" fill="#6B879C"/><text x="96" y="200">Causal time-series anomaly detection</text>
    <circle cx="78" cy="233" r="4" fill="#6B879C"/><text x="96" y="240">Foundation-model adaptation</text>
    <circle cx="78" cy="273" r="4" fill="#6B879C"/><text x="96" y="280">Robust and test-time adaptation</text>
    <circle cx="78" cy="313" r="4" fill="#6B879C"/><text x="96" y="320">Efficient learning and model compression</text>

    <circle cx="658" cy="153" r="4" fill="#7B858E"/><text x="676" y="160">PyTorch experimentation and evaluation</text>
    <circle cx="658" cy="193" r="4" fill="#7B858E"/><text x="676" y="200">NLP fine-tuning and inference workflows</text>
    <circle cx="658" cy="233" r="4" fill="#7B858E"/><text x="676" y="240">AI agents and tool-based automation</text>
    <circle cx="658" cy="273" r="4" fill="#7B858E"/><text x="676" y="280">Docker, CI, Flask, MongoDB</text>
    <circle cx="658" cy="313" r="4" fill="#7B858E"/><text x="676" y="320">Reproducible GPU and dependency debugging</text>
  </g>
</svg>