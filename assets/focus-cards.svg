<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Research and engineering focus</title>
  <desc id="desc">Two restrained panels describing research and engineering work.</desc>
  <rect width="1200" height="360" rx="20" fill="#0C1116"/>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="42" y="36" width="538" height="288" rx="14" fill="#11181F" stroke="#2E3942"/>
    <rect x="620" y="36" width="538" height="288" rx="14" fill="#11181F" stroke="#2E3942"/>

    <text x="72" y="74" fill="#B59A6A" font-size="12" font-weight="700" letter-spacing="1.8">01 / RESEARCH</text>
    <text x="650" y="74" fill="#71879A" font-size="12" font-weight="700" letter-spacing="1.8">02 / ENGINEERING</text>
    <line x1="72" y1="91" x2="548" y2="91" stroke="#2F3A43"/>
    <line x1="650" y1="91" x2="1126" y2="91" stroke="#2F3A43"/>

    <g fill="#E9E6DE" font-size="19" font-weight="700">
      <text x="72" y="126">Research focus</text>
      <text x="650" y="126">Engineering practice</text>
    </g>

    <g fill="#BEC6CC" font-size="16">
      <text x="72" y="164">Visual and time-series anomaly detection</text>
      <text x="72" y="201">Foundation-model adaptation and robustness</text>
      <text x="72" y="238">Causal / online evaluation</text>
      <text x="72" y="275">Efficient learning and model compression</text>

      <text x="650" y="164">PyTorch experiments and evaluation pipelines</text>
      <text x="650" y="201">NLP fine-tuning and inference workflows</text>
      <text x="650" y="238">AI agents, tool use, and automation</text>
      <text x="650" y="275">Docker, CI, Flask, MongoDB, GPU debugging</text>
    </g>

    <g stroke-width="2">
      <line x1="72" y1="158" x2="96" y2="158" stroke="#B59A6A"/>
      <line x1="72" y1="195" x2="96" y2="195" stroke="#B59A6A"/>
      <line x1="72" y1="232" x2="96" y2="232" stroke="#B59A6A"/>
      <line x1="72" y1="269" x2="96" y2="269" stroke="#B59A6A"/>

      <line x1="650" y1="158" x2="674" y2="158" stroke="#71879A"/>
      <line x1="650" y1="195" x2="674" y2="195" stroke="#71879A"/>
      <line x1="650" y1="232" x2="674" y2="232" stroke="#71879A"/>
      <line x1="650" y1="269" x2="674" y2="269" stroke="#71879A"/>
    </g>

    <text x="72" y="307" fill="#707E88" font-size="12">evidence · evaluation · reproducibility</text>
    <text x="650" y="307" fill="#707E88" font-size="12">systems · implementation · reliability</text>
  </g>
</svg>