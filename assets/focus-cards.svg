<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Research and engineering focus</title>
  <desc id="desc">Research and engineering areas shown in two aligned panels.</desc>
  <rect width="1200" height="400" rx="22" fill="#0F1720"/>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="40" y="40" width="540" height="320" rx="16" fill="#16212B" stroke="#34424E"/>
    <rect x="620" y="40" width="540" height="320" rx="16" fill="#16212B" stroke="#34424E"/>

    <rect x="70" y="72" width="64" height="4" rx="2" fill="#6F8495"/>
    <rect x="650" y="72" width="64" height="4" rx="2" fill="#78838C"/>
    <text x="70" y="112" fill="#F2F5F7" font-size="26" font-weight="700">RESEARCH</text>
    <text x="650" y="112" fill="#F2F5F7" font-size="26" font-weight="700">ENGINEERING</text>

    <g font-size="17" fill="#C9D1D8">
      <circle cx="78" cy="155" r="4" fill="#6F8495"/><text x="96" y="161">Visual anomaly detection</text>
      <circle cx="78" cy="198" r="4" fill="#6F8495"/><text x="96" y="204">Causal time-series anomaly detection</text>
      <circle cx="78" cy="241" r="4" fill="#6F8495"/><text x="96" y="247">Foundation-model adaptation</text>
      <circle cx="78" cy="284" r="4" fill="#6F8495"/><text x="96" y="290">Robust and test-time adaptation</text>
      <circle cx="78" cy="327" r="4" fill="#6F8495"/><text x="96" y="333">Efficient learning and model compression</text>

      <circle cx="658" cy="155" r="4" fill="#78838C"/><text x="676" y="161">PyTorch experimentation and evaluation</text>
      <circle cx="658" cy="198" r="4" fill="#78838C"/><text x="676" y="204">NLP fine-tuning and inference workflows</text>
      <circle cx="658" cy="241" r="4" fill="#78838C"/><text x="676" y="247">AI agents and tool-based automation</text>
      <circle cx="658" cy="284" r="4" fill="#78838C"/><text x="676" y="290">Docker, CI, Flask, and MongoDB</text>
      <circle cx="658" cy="327" r="4" fill="#78838C"/><text x="676" y="333">GPU, model, and dependency debugging</text>
    </g>
  </g>
</svg>